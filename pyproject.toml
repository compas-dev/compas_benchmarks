[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

# ============================================================================
# project info
# ============================================================================

[project]
name = "compas_benchmarks"
description = "Benchmarks for the COMPAS core ecosystem."
keywords = ["architecture", "engineering", "fabrication", "construction", "benchmark"]
authors = [{ name = "Gonzalo Casas", email = "casas@arch.ethz.ch" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"
version = "0.1.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# `inheritance`-aware dtype resolution (used by the msgpack format) landed in compas 2.12.
dependencies = ["compas>=2.12"]

[project.optional-dependencies]
# Optional serialization formats. Every format registers as unavailable and is skipped
# when its dependency is missing, so the benchmark still runs without these.
formats = ["compas_pb>=1.1.4", "msgspec", "zstandard"]

[project.urls]
Repository = "https://github.com/compas-dev/compas_benchmarks.git"
Issues = "https://github.com/compas-dev/compas_benchmarks/issues"

# Tooling is a dependency group rather than an extra: it is needed to work on the
# benchmarks, never to install them.
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

# ============================================================================
# uv
# ============================================================================

[tool.uv]
# The tooling group is always wanted; the optional formats are requested with
# `uv sync --all-extras`, since benchmarking them means installing them.
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "compas_benchmarks"
module-root = "src"

# ============================================================================
# pytest
# ============================================================================

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests", "src/compas_benchmarks"]
python_files = ["test_*.py", "*_test.py", "test.py"]
addopts = ["-ra", "--strict-markers", "--tb=short"]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ALLOW_UNICODE",
    "ALLOW_BYTES",
    "NUMBER",
]

# ============================================================================
# style — ruff only, for both linting and formatting
# ============================================================================

[tool.ruff]
line-length = 179
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]
"tests/*" = ["I001"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["compas_benchmarks"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 179

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
