name: serialization-benchmark

# Runs the serialization benchmark and publishes its interactive HTML report to GitHub Pages,
# so the results are read where they are readable instead of flattened into a job summary.
#
# PR runs always use the `quick` preset and upload the report as an artifact — they do not
# publish, so the site keeps showing `main`. Sizes and losslessness are deterministic; the
# timings are only indicative on a shared runner — use workflow_dispatch (or a dedicated
# machine) when the exact timings matter.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      preset:
        description: "Corpus size preset"
        type: choice
        options: [quick, full]
        default: quick
      repeat:
        description: "Timed runs per measurement (median reported)"
        default: "5"
      compas_ref:
        description: "compas version to benchmark: a PyPI specifier, or a git ref as 'git:<branch|tag|sha>'"
        default: ""
      compas_pb_ref:
        description: "compas_pb version to benchmark: a PyPI specifier, or a git ref as 'git:<branch|tag|sha>'"
        default: ""
      formats:
        description: "formats to benchmark (json, json_zip, compas_pb, compas_pb_zip, compas_pb_zstd, compas_msgpack, compas_msgpack_zstd)"
        default: "json compas_pb"

permissions:
  contents: read

# One run per ref; a new commit cancels the previous run for the same PR.
concurrency:
  group: serialization-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      PRESET: ${{ inputs.preset || 'quick' }}
      RESULTS_DIR: ${{ github.workspace }}/results
      # The environment is synced once, below; a version override would otherwise be undone
      # by the next `uv run` re-syncing back to uv.lock.
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install benchmarks + subjects under test
        env:
          COMPAS_REF: ${{ inputs.compas_ref }}
          COMPAS_PB_REF: ${{ inputs.compas_pb_ref }}
        run: |
          # The locked environment: compas plus the optional formats (compas_pb, msgspec,
          # zstandard). This is the version pair a plain run benchmarks.
          uv sync --all-extras --locked

          # Optionally override either subject under test. "git:<ref>" installs from GitHub
          # (compas_pb commits its generated _pb2 modules, so no protoc is needed; both repos
          # are public, so no auth is required); anything else is a plain PyPI specifier.
          install_override () {
            name="$1"; repo="$2"; ref="$3"
            [ -z "$ref" ] && return 0
            case "$ref" in
              git:*) uv pip install "$name @ git+https://github.com/$repo.git@${ref#git:}" ;;
              *) uv pip install "$name$ref" ;;
            esac
          }
          install_override compas compas-dev/compas "$COMPAS_REF"
          install_override compas_pb gramaziokohler/compas_pb "$COMPAS_PB_REF"

      - name: Show versions
        run: |
          uv run python -c "import compas, compas_pb, msgspec, zstandard; print('compas', compas.__version__); print('compas_pb', compas_pb.__version__)"

      - name: Run benchmark (${{ inputs.preset || 'quick' }})
        run: |
          uv run python -m compas_benchmarks.serialization.run \
            --preset "$PRESET" \
            --repeat "${{ inputs.repeat || '5' }}" \
            --formats ${{ inputs.formats || 'json compas_pb' }} \
            --out "$RESULTS_DIR/baseline_$PRESET.csv"

      - name: Build site
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          uv run python -m compas_benchmarks.site "$RESULTS_DIR" \
            --out "${{ runner.temp }}/site" \
            --run-url "$RUN_URL" \
            --source-url "$SOURCE_URL"

      # Always downloadable (the only way to see a PR run's report, since PRs do not publish).
      - name: Upload results
        id: upload-results
        uses: actions/upload-artifact@v7
        with:
          name: serialization-benchmark-${{ inputs.preset || 'quick' }}-${{ github.run_number }}
          path: ${{ runner.temp }}/site/
          retention-days: 90
          if-no-files-found: error

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Link to the results
        env:
          ARTIFACT_URL: ${{ steps.upload-results.outputs.artifact-url }}
        run: |
          {
            echo "### Serialization benchmark (\`$PRESET\`)"
            echo
            echo "[Download the interactive HTML report, CSV, and encoded samples]($ARTIFACT_URL)"
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo
              echo "Publishing to GitHub Pages — see the \`deploy\` job for the URL."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: benchmark
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
